<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relay Protocol</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<style>
  :root {
    --bg: #fff6e9;
    --panel: #ffffff;
    --panel-highlight: #fff0d6;
    --border: #f0d9b5;
    --text: #3a2e1f;
    --muted: #9a8568;
    --accent: #4ea8ff;
    --accent2: #b980ff;
    --danger: #ff5a5f;
    --ok: #35c26a;
    --warn: #ffd23f;
    --font-mono: 'Nunito', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
    --font-display: 'Baloo 2', var(--font-mono), sans-serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    font-family: 'Nunito', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  h1, h2, h3, .timer, .role-name { font-family: var(--font-display); }
  .hazard-strip {
    height: 8px;
    border-radius: 4px;
    margin: 0.4rem 0 1rem;
    background: repeating-linear-gradient(
      45deg,
      var(--warn) 0px, var(--warn) 10px,
      #ffb703 10px, #ffb703 20px
    );
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }
  @media (prefers-contrast: more) {
    :root { --border: #6b4f1f; --muted: #5c4a30; }
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 1rem; }
  h1 { font-size: 1.4rem; margin: 0.2rem 0 0.4rem; }
  p.tagline { color: var(--muted); margin-top: 0; }
  fieldset { border: 1px solid var(--border); border-radius: 8px; margin-bottom: 1rem; }
  legend { padding: 0 0.4rem; color: var(--muted); }
  label { display: block; margin: 0.5rem 0 0.25rem; }
  input[type=text] {
    width: 100%; padding: 0.6rem; border-radius: 6px; border: 1px solid var(--border);
    background: var(--panel); color: var(--text); font-size: 1rem;
  }
  input[type=text]:focus, button:focus, [role=button]:focus {
    outline: 3px solid var(--accent); outline-offset: 2px;
  }
  button {
    background: var(--accent); color: #ffffff; border: none; border-radius: 10px;
    padding: 0.65rem 1rem; font-size: 1rem; font-weight: 700; cursor: pointer;
    min-height: 44px; font-family: var(--font-display);
    box-shadow: 0 3px 0 rgba(0,0,0,0.12);
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button.secondary { background: transparent; border: 2px solid var(--border); color: var(--text); box-shadow: none; }
  .row { display: flex; gap: 0.5rem; flex-wrap: wrap; }
  .card {
    background-color: var(--panel);
    background-image: radial-gradient(circle at 15% 10%, var(--panel-highlight), var(--panel) 65%);
    position: relative;
    border: 2px solid var(--border); border-radius: 16px;
    padding: 1rem; margin-bottom: 1rem;
    box-shadow: 0 4px 0 var(--border);
  }
  .card::before, .card::after {
    content: '';
    position: absolute; top: 8px; width: 14px; height: 14px;
    background: radial-gradient(circle at 35% 35%, #ffe08a, var(--warn) 70%);
    border-radius: 50%;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.5);
  }
  .card::before { left: 8px; }
  .card::after { right: 8px; }
  .role-grid { display: grid; grid-template-columns: 1fr; gap: 0.5rem; }
  @media (min-width: 480px) { .role-grid { grid-template-columns: 1fr 1fr; } }
  .role-btn {
    display: block; width: 100%; text-align: left; background: var(--panel);
    border: 1px solid var(--border); border-radius: 8px; padding: 0.75rem;
  }
  .role-btn[aria-pressed="true"] { border-color: var(--accent); background: #eaf4ff; }
  .role-btn:disabled { opacity: 0.4; }
  .role-name { font-weight: 700; display: block; }
  .role-desc { color: var(--muted); font-size: 0.85rem; }
  .status-list { list-style: none; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 0.4rem; }
  .status-list li {
    font-family: var(--font-mono);
    border: 1px solid var(--border); border-radius: 999px; padding: 0.2rem 0.7rem; font-size: 0.85rem;
  }
  .status-list li.connected { border-color: var(--ok); }
  .status-list li.disconnected { color: var(--muted); }
  .timer {
    font-family: var(--font-mono);
    font-size: 2.2rem; font-weight: 800; text-align: center; font-variant-numeric: tabular-nums;
  }
  .timer.low { color: var(--danger); border-top: 3px solid var(--danger); padding-top: 0.3rem; }
  .spread-track {
    height: 10px; border-radius: 999px; background: var(--panel); border: 1px solid var(--border);
    overflow: hidden; margin: 0.4rem 0;
  }
  .spread-fill {
    height: 100%; border-radius: 999px;
    background: linear-gradient(90deg, var(--ok), var(--warn) 60%, var(--danger));
    transition: width 0.3s ease;
  }
  @media (prefers-reduced-motion: reduce) { .spread-fill { transition: none; } }
  .spread-label { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--muted); }
  .spread-label.breach { color: var(--danger); }
  .wire-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 0.6rem; margin: 0.75rem 0; }
  .bomb3d-mount {
    width: 100%; aspect-ratio: 1 / 1; max-height: 60vh; margin: 0.75rem 0;
    border: 2px solid var(--border); border-radius: 10px; overflow: hidden; background: #eef2ff; touch-action: none;
  }
  .bomb3d-mount canvas { display: block; width: 100% !important; height: 100% !important; }
  .bomb3d-hint { color: var(--muted); font-size: 0.8rem; text-align: center; margin: 0.2rem 0 0; }
  .wire-btn {
    aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    border: 2px solid var(--border); border-radius: 10px; background: var(--panel); color: var(--text); gap: 0.35rem;
  }
  .wire-btn[data-cut="true"] { opacity: 0.35; text-decoration: line-through; border-style: dashed; }
  .wire-shape { width: 34px; height: 34px; }
  .bomb-key {
    font-family: var(--font-mono); background: #eaf4ff; border: 1px solid var(--accent);
    border-radius: 8px; padding: 0.5rem 0.75rem; letter-spacing: 0.08em;
  }
  .freq-readout, .freq-controls {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 0.75rem; margin: 0.75rem 0;
  }
  .freq-readout p, .freq-controls label { margin: 0.2rem 0; }
  .freq-controls input[type="range"] { width: 100%; margin: 0.4rem 0 0.1rem; }
  .freq-zone-ticks { position: relative; height: 1.1rem; font-family: var(--font-mono); font-weight: 700; color: var(--muted); margin-bottom: 0.3rem; }
  .freq-controls output { display: inline-block; font-family: var(--font-mono); font-size: 1.1rem; margin-right: 0.6rem; }
  .wire-color-swatch { display: block; width: 22px; height: 22px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.4); }
  .symbol-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.5rem; }
  .symbol-btn { font-size: 1.5rem; padding: 0.6rem; }
  .signal-btn { display: flex; align-items: center; gap: 0.4rem; }
  .reel-control {
    display: flex; flex-direction: column; align-items: center; gap: 0.3rem;
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 0.5rem;
  }
  .reel-btn { padding: 0.3rem 0.6rem; min-height: 36px; }
  .reel-letter { font-family: var(--font-mono); font-size: 1.6rem; font-weight: 800; }
  .submit-password-btn { width: 100%; margin-top: 0.6rem; }
  .maze-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.4rem; max-width: 220px; margin: 0.6rem auto; }
  .maze-btn { min-height: 48px; }
  .morse-table {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); gap: 0.3rem;
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 0.6rem; margin: 0.5rem 0;
  }
  .morse-cell {
    display: flex; flex-direction: column; align-items: center; gap: 0.1rem;
    border: 1px solid var(--border); border-radius: 6px; padding: 0.3rem 0.15rem; background: var(--bg);
  }
  .morse-letter { font-family: var(--font-display); font-weight: 800; font-size: 1rem; }
  .morse-code { font-family: var(--font-mono); letter-spacing: 0.12em; color: var(--muted); font-size: 0.9rem; }
  .log { font-family: var(--font-mono); max-height: 140px; overflow-y: auto; font-size: 0.85rem; border-top: 1px solid var(--border); padding-top: 0.5rem; }
  .log div { padding: 0.15rem 0; color: var(--muted); }
  .banner { padding: 0.75rem; border-radius: 8px; margin-bottom: 1rem; font-weight: 600; text-align: center; }
  .banner.won { background: #dffbe8; color: #17914b; }
  .banner.lost {
    background: repeating-linear-gradient(45deg, #ffe3e4 0px, #ffe3e4 12px, #ffd0d2 12px, #ffd0d2 24px);
    color: var(--danger);
    border: 1px solid var(--danger);
  }
  .instruction-box {
    font-family: var(--font-mono);
    background: #eaf4ff; border: 1px solid var(--accent); border-radius: 8px; padding: 0.75rem; font-size: 1.05rem;
  }
  .visually-hidden {
    position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap;
  }
  .visually-hidden-focusable {
    position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap;
  }
  .visually-hidden-focusable:focus {
    position: static; width: auto; height: auto; overflow: visible; clip: auto; white-space: normal;
  }
  .wire-grid:focus-within { position: static; }
  .conn-flag { font-size: 0.8rem; color: var(--warn); }
  .mode-note {
    background: #eaf4ff; border: 1px solid var(--border); border-radius: 8px;
    padding: 0.6rem 0.75rem; font-size: 0.9rem; color: var(--muted); margin-bottom: 1rem;
  }
  .reveal-btn { width: 100%; margin-bottom: 0.6rem; background: var(--warn); color: #4a3300; }
  .reveal-btn[aria-pressed="true"] { background: var(--ok); }
  .gated-content { filter: blur(18px); transition: filter 0.15s; }
  .reveal-gate.revealed .gated-content { filter: none; }
</style>
</head>
<body>
<div class="wrap" id="app">
  <h1>Relay Protocol</h1>
  <p class="tagline">A signal-quarantine relay game. No one player can see everything — say what you know.</p>
  <div class="hazard-strip" role="presentation"></div>
  <div id="root" aria-live="polite"></div>
</div>

<script>
(function () {
  'use strict';

  const ALPHABET = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';

  // Fixed calibration printed on every dial face, same every game — public
  // knowledge like the markings on a real instrument. What's secret is
  // which letter applies this round (that's the manual), not where the
  // letters sit on the dial.
  const FREQ_ZONES = { A: 15, B: 40, C: 60, D: 85 };

  const SHAPE_SVGS = {
    circle: '<svg viewBox="0 0 40 40" class="wire-shape" aria-hidden="true"><circle cx="20" cy="20" r="15" fill="currentColor"/></svg>',
    triangle: '<svg viewBox="0 0 40 40" class="wire-shape" aria-hidden="true"><polygon points="20,5 35,33 5,33" fill="currentColor"/></svg>',
    square: '<svg viewBox="0 0 40 40" class="wire-shape" aria-hidden="true"><rect x="6" y="6" width="28" height="28" fill="currentColor"/></svg>',
    diamond: '<svg viewBox="0 0 40 40" class="wire-shape" aria-hidden="true"><polygon points="20,4 36,20 20,36 4,20" fill="currentColor"/></svg>',
    star: '<svg viewBox="0 0 40 40" class="wire-shape" aria-hidden="true"><polygon points="20,3 24,15 37,15 26,23 30,35 20,27 10,35 14,23 3,15 16,15" fill="currentColor"/></svg>'
  };

  const DIFFICULTY_LABELS = { easy: 'Easy', medium: 'Medium', hard: 'Hard' };

  const ROLE_INFO = {
    operator: {
      name: 'Operator',
      desc: "Sees the whole bomb — every color, every module — but has no manual. Acts on instructions from the Specialist(s)."
    },
    specialist: {
      name: 'Specialist',
      desc: 'Has the manual for every module — full rules, no bomb. Type instructions for the Operator.'
    },
    specialist_1: {
      name: 'Specialist (Module A)',
      desc: 'Has the manual for one of the two active modules only. Type instructions for the Operator.'
    },
    specialist_2: {
      name: 'Specialist (Module B)',
      desc: 'Has the manual for the other active module. Blind to what Specialist (Module A) knows.'
    }
  };

  const state = {
    roomId: null,
    playerId: null,
    mode: null,
    view: null,
    es: null,
    reconnectDelay: 1000,
    revealed: false,
    lastSignature: null,
    domBuilt: false,
  };

  const root = document.getElementById('root');

  function saveSession() {
    if (state.roomId && state.playerId) {
      sessionStorage.setItem('relay-session', JSON.stringify({ roomId: state.roomId, playerId: state.playerId }));
    }
  }
  function loadSession() {
    try {
      return JSON.parse(sessionStorage.getItem('relay-session') || 'null');
    } catch (e) { return null; }
  }
  function clearSession() {
    sessionStorage.removeItem('relay-session');
  }

  async function api(path, body) {
    const res = await fetch(path, {
      method: body ? 'POST' : 'GET',
      headers: body ? { 'Content-Type': 'application/json' } : undefined,
      body: body ? JSON.stringify(body) : undefined,
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || 'Request failed');
    return data;
  }

  function connectStream() {
    if (state.es) state.es.close();
    const es = new EventSource(`/api/room/stream?roomId=${encodeURIComponent(state.roomId)}&playerId=${encodeURIComponent(state.playerId)}`);
    es.onmessage = (evt) => {
      state.reconnectDelay = 1000;
      state.view = JSON.parse(evt.data);
      render();
    };
    es.onerror = () => {
      es.close();
      const delay = Math.min(state.reconnectDelay, 10000);
      setTimeout(connectStream, delay);
      state.reconnectDelay = delay * 1.6;
      renderConnFlag(true);
    };
    state.es = es;
  }

  function renderConnFlag(show) {
    const el = document.getElementById('conn-flag');
    if (el) el.hidden = !show;
  }

  // ---- Screens --------------------------------------------------------

  function renderLobbyForm() {
    root.innerHTML = `
      <div class="card">
        <label for="name-input">Your name</label>
        <input id="name-input" type="text" maxlength="24" autocomplete="off" value="${escapeAttr(localStorage.getItem('relay-name') || '')}">

        <label for="room-input">Room code (leave blank to create a new room)</label>
        <input id="room-input" type="text" maxlength="8" autocomplete="off">

        <fieldset>
          <legend>Player count</legend>
          <div class="row" role="radiogroup" aria-label="Player count">
            <label><input type="radio" name="mode" value="2" checked> 2 players</label>
            <label><input type="radio" name="mode" value="3"> 3 players</label>
          </div>
        </fieldset>

        <fieldset>
          <legend>How are you playing?</legend>
          <div class="row" role="radiogroup" aria-label="Play style">
            <label><input type="radio" name="playStyle" value="online" checked> Online (separate locations)</label>
            <label><input type="radio" name="playStyle" value="local"> Same room (playing together in person)</label>
          </div>
        </fieldset>

        <fieldset>
          <legend>Difficulty</legend>
          <div class="row" role="radiogroup" aria-label="Difficulty">
            <label><input type="radio" name="difficulty" value="easy"> Easy</label>
            <label><input type="radio" name="difficulty" value="medium" checked> Medium</label>
            <label><input type="radio" name="difficulty" value="hard"> Hard</label>
          </div>
          <p class="mode-note">Easy: fewer wires/simpler puzzles, more time, softer wrong-action penalty. Hard: the opposite. Only set when creating a new room — joining an existing room uses its difficulty.</p>
        </fieldset>

        <button id="join-btn" type="button">Join / Create Room</button>
        <p id="join-error" role="alert" style="color:var(--danger)"></p>
      </div>
    `;
    document.getElementById('join-btn').addEventListener('click', async () => {
      const name = document.getElementById('name-input').value.trim() || 'Player';
      const roomId = document.getElementById('room-input').value.trim();
      const mode = Number(document.querySelector('input[name=mode]:checked').value);
      const playStyle = document.querySelector('input[name=playStyle]:checked').value;
      const difficulty = document.querySelector('input[name=difficulty]:checked').value;
      localStorage.setItem('relay-name', name);
      try {
        const data = await api('/api/room/join', { name, roomId, mode, playStyle, difficulty });
        state.roomId = data.roomId;
        state.playerId = data.playerId;
        state.mode = data.mode;
        saveSession();
        connectStream();
      } catch (e) {
        document.getElementById('join-error').textContent = e.message;
      }
    });
  }

  function renderRolePicker(view) {
    const roles = Object.keys(ROLE_INFO).filter((r) =>
      (view.mode === 2 ? ['operator', 'specialist'] : ['operator', 'specialist_1', 'specialist_2']).includes(r)
    );
    const taken = new Set(view.players.map((p) => p.role).filter(Boolean));
    return `
      <div class="card">
        <h2>Room ${escapeHtml(view.roomId)}</h2>
        <p>Share this room code with your teammate${view.mode === 3 ? 's' : ''}. ${view.mode}-player mode &mdash; <strong>${DIFFICULTY_LABELS[view.difficulty] || 'Medium'}</strong> difficulty.</p>
        ${renderModeNote(view)}
        ${view.round > 1 ? `<p style="color:var(--warn)">Round ${view.round} — more wires, less time, and new rule types unlock as you win.</p>` : ''}
        <div class="role-grid" role="group" aria-label="Choose your role">
          ${roles.map((r) => {
            const info = ROLE_INFO[r];
            const isTaken = taken.has(r) && view.yourRole !== r;
            const isMine = view.yourRole === r;
            return `<button class="role-btn" data-role="${r}" aria-pressed="${isMine}" ${isTaken ? 'disabled' : ''}>
              <span class="role-name">${info.name}${isTaken ? ' (taken)' : ''}</span>
              <span class="role-desc">${info.desc}</span>
            </button>`;
          }).join('')}
        </div>
        ${renderPlayerStatus(view)}
        <button id="start-btn" type="button" ${allRolesFilled(view) ? '' : 'disabled'}>Begin Containment</button>
        ${!allRolesFilled(view) ? '<p class="conn-flag">Waiting for every role to be filled.</p>' : ''}
      </div>
    `;
  }

  function renderModeNote(view) {
    if (view.playStyle === 'local') {
      return `<p class="mode-note">Playing together in person: keep the Operator's screen and the Specialist's screen hidden from each other — the whole challenge is relaying info only through voice.</p>`;
    }
    return `<p class="mode-note">Playing remotely: run a voice/video call alongside the app so the Operator and Specialist(s) can talk freely while looking at different information.</p>`;
  }

  function allRolesFilled(view) {
    const needed = view.mode === 2 ? 2 : 3;
    return view.players.length === needed && view.players.every((p) => p.role);
  }

  function renderPlayerStatus(view) {
    return `<ul class="status-list" aria-label="Connected players">
      ${view.players.map((p) => `<li class="${p.connected ? 'connected' : 'disconnected'}">${escapeHtml(p.name)} — ${p.role ? ROLE_INFO[p.role].name : 'choosing role'} ${p.connected ? '' : '(offline)'}</li>`).join('')}
    </ul>`;
  }

  const FACE_LABELS = { front: 'FRONT', back: 'BACK', left: 'LEFT', right: 'RIGHT', top: 'TOP', bottom: 'BOTTOM' };

  function renderTimer(view) {
    const low = view.timeRemaining <= 20;
    const m = Math.floor(view.timeRemaining / 60);
    const s = String(view.timeRemaining % 60).padStart(2, '0');
    const breach = view.spread >= 50;
    const progress = view.modulesTotal != null ? `Modules solved: ${view.modulesSolved}/${view.modulesTotal}` : '';
    return `<div class="timer ${low ? 'low' : ''}" role="timer" aria-label="Time remaining ${view.timeRemaining} seconds">${m}:${s}</div>
    <div class="spread-track" role="progressbar" aria-label="Signal spread" aria-valuenow="${view.spread}" aria-valuemin="0" aria-valuemax="100">
      <div class="spread-fill" style="width:${view.spread}%"></div>
    </div>
    <p class="spread-label ${breach ? 'breach' : ''}">Spread: ${view.spread}%${breach ? ' — containment breached, ruleset shifted' : ''}</p>
    <p style="text-align:center;color:var(--muted)">Round ${view.round} &middot; ${DIFFICULTY_LABELS[view.difficulty] || 'Medium'}${progress ? ' &middot; ' + progress : ''}</p>`;
  }

  // Shared read-only single-module panel. Color is always shown now — the
  // Operator sees the full bomb same as a real defuser; the only thing
  // withheld from anyone is the rule itself (that's the manual, added
  // separately by the caller for whoever holds it).
  function renderModulePanel(mod) {
    if (mod.moduleType === 'wire_cut') {
      const wires = (mod.wires || []).map((w) => `
        <div class="wire-btn" data-cut="${w.cut}" aria-label="Wire position ${w.position + 1}, ${w.color} ${w.shape}${w.cut ? ', cut' : ''}">
          ${SHAPE_SVGS[w.shape]}
          ${colorSwatch(w.color)}
          <span aria-hidden="true">#${w.position + 1}</span>
        </div>
      `).join('');
      return `<div class="wire-grid" role="group" aria-label="Wire panel">${wires}</div>`;
    }
    if (mod.moduleType === 'handshake_grid' && mod.grid) {
      const g = mod.grid;
      const nodes = g.nodes.map((n) => `
        <div class="wire-btn" data-cut="${n.pressed}" aria-label="Node row ${n.row + 1} column ${n.col + 1}, ${n.color} ${n.shape}${n.pressed ? ', pressed' : ''}">
          ${SHAPE_SVGS[n.shape]}
          ${colorSwatch(n.color)}
        </div>
      `).join('');
      return `<div class="wire-grid" role="group" aria-label="Handshake grid" style="grid-template-columns:repeat(${g.size}, 1fr)">${nodes}</div>`;
    }
    if (mod.moduleType === 'frequency_lock' && mod.freq) {
      const f = mod.freq;
      const hasZone = f.zone != null;
      return `
        <div class="freq-readout">
          <p>Channel key: <strong>${f.channelLabel}</strong></p>
          ${hasZone ? `<p>Target zone: <strong>ZONE ${f.zone}</strong> &mdash; tell the Operator to find it on their dial face.</p>` : ''}
          <p>Current dial reading: <strong>${f.dialValue}</strong></p>
        </div>
      `;
    }
    if (mod.moduleType === 'signal_decode' && mod.signal) {
      const s = mod.signal;
      return `
        <div class="freq-readout">
          <p>Flashed sequence: <strong>${s.signals.map((c) => c.toUpperCase()).join(' -> ')}</strong></p>
          <p>Progress: <strong>${s.progress}/${s.signals.length}</strong></p>
        </div>
      `;
    }
    if (mod.moduleType === 'password_lock' && mod.password) {
      const p = mod.password;
      return `
        <div class="freq-readout">
          <p>Current reels: <strong>${p.reels.map((r) => ALPHABET[r.letterIndex]).join('')}</strong></p>
        </div>
      `;
    }
    if (mod.moduleType === 'maze' && mod.maze) {
      const mz = mod.maze;
      return `
        <div class="freq-readout">
          <p>Operator position: <strong>(${mz.pos.row}, ${mz.pos.col})</strong> &mdash; Goal: <strong>(${mz.goal.row}, ${mz.goal.col})</strong></p>
        </div>
      `;
    }
    if (mod.moduleType === 'morse_relay' && mod.morse) {
      const ms = mod.morse;
      return `
        <div class="freq-readout">
          <p>Flashed groups: <strong>${ms.signals.join('  /  ')}</strong></p>
          <p>Progress: <strong>${ms.progress}/${ms.signals.length}</strong></p>
        </div>
        ${renderMorseTable(ms.table)}
      `;
    }
    return '';
  }

  const MODULE_NAMES = {
    wire_cut: 'Wire Cut', handshake_grid: 'Handshake Grid', frequency_lock: 'Frequency Lock',
    signal_decode: 'Signal Decode', password_lock: 'Password Lock',
    maze: 'Maze', morse_relay: 'Morse Relay',
  };

  function moduleHeading(mod) {
    const face = FACE_LABELS[mod.face] || mod.face;
    const status = mod.solved ? ' — SOLVED' : '';
    return `<h3>${MODULE_NAMES[mod.moduleType] || mod.moduleType} &mdash; ${face} face${status}</h3>`;
  }

  function renderGameScreen(view) {
    let banner = '';
    if (view.status === 'won') banner = '<div class="banner won" role="status">Signal contained! Great relay work.</div>';
    if (view.status === 'lost') banner = '<div class="banner lost" role="status">Quarantine breach. Reset and try a new signal.</div>';

    let body = '';
    if (view.yourRole === 'operator') {
      body = renderOperator(view);
    } else if (['specialist', 'specialist_1', 'specialist_2'].includes(view.yourRole)) {
      body = renderSpecialist(view);
    }

    return `
      <div class="card">
        <h2>${ROLE_INFO[view.yourRole].name} &mdash; Room ${escapeHtml(view.roomId)}</h2>
        ${renderPlayerStatus(view)}
        ${banner}
        ${renderTimer(view)}
        ${body}
        <div class="row" style="margin-top:1rem">
          <button class="secondary" id="reset-btn" type="button">Reset / New Puzzle</button>
        </div>
      </div>
    `;
  }

  function colorSwatch(color) {
    return `<span class="wire-color-swatch" style="background:${color}" aria-hidden="true"></span>`;
  }

  // Fixed public Morse reference, rendered as a scannable grid instead of
  // one long inline string of "A=.- B=-... C=-.-." that was hard to scan
  // under time pressure.
  function renderMorseTable(table) {
    if (!table) return '';
    const cells = Object.entries(table).map(([letter, code]) => `
      <div class="morse-cell"><span class="morse-letter">${letter}</span><span class="morse-code">${code}</span></div>
    `).join('');
    return `<div class="morse-table" role="table" aria-label="Morse code reference">${cells}</div>`;
  }

  function bombKeyBanner(view) {
    if (!view.bombKey) return '';
    return `<p class="bomb-key">Bomb key: <strong>${escapeHtml(view.bombKey)}</strong></p>`;
  }

  function formatRuleText(text) {
    return escapeHtml(text).replace(/\n/g, '<br>');
  }

  // The Operator sees full color everywhere now (real KTANE: the defuser
  // sees the actual bomb) — only the accessible fallback controls, not the
  // info shown, differ from a Specialist's read-only panel.
  function renderOperatorModuleFallback(mod, view) {
    const active = view.status === 'active' && !mod.solved;
    if (mod.moduleType === 'wire_cut') {
      return `<div class="wire-grid">
        ${(mod.wires || []).map((w) => `
          <button class="wire-btn visually-hidden-focusable" data-wire="${w.id}" data-face="${mod.face}" data-cut="${w.cut}" ${w.cut || !active ? 'disabled' : ''}
            aria-label="${FACE_LABELS[mod.face]} face, wire position ${w.position + 1}, ${w.color} ${w.shape}${w.cut ? ', already cut' : ''}">
            ${SHAPE_SVGS[w.shape]}
            ${colorSwatch(w.color)}
            <span aria-hidden="true">#${w.position + 1}</span>
          </button>
        `).join('')}
      </div>`;
    }
    if (mod.moduleType === 'handshake_grid' && mod.grid) {
      const g = mod.grid;
      return `<div class="wire-grid" style="grid-template-columns:repeat(${g.size}, 1fr)">
        ${g.nodes.map((n) => `
          <button class="wire-btn visually-hidden-focusable" data-node="${n.id}" data-face="${mod.face}" data-cut="${n.pressed}" ${n.pressed || !active ? 'disabled' : ''}
            aria-label="${FACE_LABELS[mod.face]} face, node row ${n.row + 1} column ${n.col + 1}, ${n.color} ${n.shape}${n.pressed ? ', already pressed' : ''}">
            ${SHAPE_SVGS[n.shape]}
            ${colorSwatch(n.color)}
          </button>
        `).join('')}
      </div>`;
    }
    if (mod.moduleType === 'frequency_lock' && mod.freq) {
      const f = mod.freq;
      const zoneTicks = Object.entries(FREQ_ZONES).map(([z, pos]) => `<span style="position:absolute;left:${pos}%;transform:translateX(-50%)">${z}</span>`).join('');
      return `
        <div class="freq-controls">
          <label for="dial-input-${mod.face}">Dial value &mdash; channel key ${f.channelLabel}</label>
          <input type="range" class="dial-input" id="dial-input-${mod.face}" data-face="${mod.face}" min="0" max="100" value="${f.dialValue}" ${!active ? 'disabled' : ''}>
          <div class="freq-zone-ticks" aria-hidden="true">${zoneTicks}</div>
          <output for="dial-input-${mod.face}" class="dial-output" id="dial-output-${mod.face}">${f.dialValue}</output>
          <button class="lock-btn" data-face="${mod.face}" type="button" ${!active ? 'disabled' : ''}>Lock In</button>
        </div>
      `;
    }
    if (mod.moduleType === 'signal_decode' && mod.signal) {
      const s = mod.signal;
      return `
        <p>Flashed sequence: <strong>${s.signals.map((c) => c.toUpperCase()).join(' -> ')}</strong> &mdash; progress ${s.progress}/${s.signals.length}</p>
        <div class="row" role="group" aria-label="Signal buttons">
          ${s.buttonColors.map((c) => `
            <button class="signal-btn" data-signal="${c}" data-face="${mod.face}" ${!active ? 'disabled' : ''} aria-label="Press ${c} button">
              ${colorSwatch(c)} ${c.toUpperCase()}
            </button>
          `).join('')}
        </div>
      `;
    }
    if (mod.moduleType === 'password_lock' && mod.password) {
      const reels = mod.password.reels.map((r, i) => `
        <div class="reel-control">
          <button class="reel-btn" data-reel="${i}" data-delta="1" data-face="${mod.face}" ${!active ? 'disabled' : ''} aria-label="Reel ${i + 1} next letter">&#9650;</button>
          <span class="reel-letter" aria-live="polite">${ALPHABET[r.letterIndex]}</span>
          <button class="reel-btn" data-reel="${i}" data-delta="-1" data-face="${mod.face}" ${!active ? 'disabled' : ''} aria-label="Reel ${i + 1} previous letter">&#9660;</button>
        </div>
      `).join('');
      return `
        <div class="row" role="group" aria-label="Password reels">${reels}</div>
        <button class="submit-password-btn" data-face="${mod.face}" type="button" ${!active ? 'disabled' : ''}>Submit Password</button>
      `;
    }
    if (mod.moduleType === 'maze' && mod.maze) {
      const mz = mod.maze;
      return `
        <p>Your position: <strong>(${mz.pos.row}, ${mz.pos.col})</strong> &mdash; Goal marker: <strong>(${mz.goal.row}, ${mz.goal.col})</strong></p>
        <div class="maze-pad" role="group" aria-label="Maze movement">
          <span></span>
          <button class="maze-btn" data-dir="N" data-face="${mod.face}" ${!active ? 'disabled' : ''} aria-label="Move north">&#9650;</button>
          <span></span>
          <button class="maze-btn" data-dir="W" data-face="${mod.face}" ${!active ? 'disabled' : ''} aria-label="Move west">&#9664;</button>
          <span></span>
          <button class="maze-btn" data-dir="E" data-face="${mod.face}" ${!active ? 'disabled' : ''} aria-label="Move east">&#9654;</button>
          <span></span>
          <button class="maze-btn" data-dir="S" data-face="${mod.face}" ${!active ? 'disabled' : ''} aria-label="Move south">&#9660;</button>
          <span></span>
        </div>
      `;
    }
    if (mod.moduleType === 'morse_relay' && mod.morse) {
      const ms = mod.morse;
      return `
        <p>Flashed groups: <strong>${ms.signals.join('  /  ')}</strong> &mdash; progress ${ms.progress}/${ms.signals.length}</p>
        ${renderMorseTable(ms.table)}
        <div class="symbol-grid" role="group" aria-label="Letter keypad">
          ${ALPHABET.split('').map((l) => `<button class="symbol-btn morse-btn" data-letter="${l}" data-face="${mod.face}" ${!active ? 'disabled' : ''} aria-label="Press letter ${l}">${l}</button>`).join('')}
        </div>
      `;
    }
    return '';
  }

  function instructionChannels(view) {
    const specRoles = view.mode === 2 ? ['specialist'] : ['specialist_1', 'specialist_2'];
    return specRoles.map((r) => ({ role: r, label: ROLE_INFO[r].name, text: (view.instructions || {})[r] || '' }));
  }

  function renderOperator(view) {
    const mount = `
      <div class="bomb3d-mount" id="bomb3d-mount" role="group" aria-label="3D bomb view" aria-hidden="true"></div>
      <p class="bomb3d-hint" aria-hidden="true">Drag to rotate — the cube has ${view.modulesTotal} modules, one per face. Click a wire, node, or dial to act on it, or use Lock In for a dial.</p>
    `;
    const modules = (view.modules || []).map((mod) => `
      ${moduleHeading(mod)}
      ${renderOperatorModuleFallback(mod, view)}
    `).join('');
    const channels = instructionChannels(view).map((c) => `
      <div class="instruction-box" aria-live="polite">
        <strong>${escapeHtml(c.label)}:</strong> ${c.text ? escapeHtml(c.text) : 'Waiting for an instruction...'}
      </div>
    `).join('');

    return `
      <p>You see the whole bomb, every color — but you have no manual. Act strictly on the instructions you're given.</p>
      ${channels}
      ${mount}
      ${modules}
    `;
  }

  function renderSpecialist(view) {
    const role = view.yourRole;
    const visibleModules = (view.modules || []).filter((m) => !m.hidden);
    const panel = visibleModules.map((mod) => `
      ${moduleHeading(mod)}
      <p><strong>Rule:</strong> ${formatRuleText(mod.ruleText)}</p>
      ${renderModulePanel(mod)}
    `).join('<hr>');
    const scopeNote = role === 'specialist'
      ? 'You have the manual for every module.'
      : `You have the manual for one module only — you cannot see what ${role === 'specialist_1' ? 'Specialist (Module B)' : 'Specialist (Module A)'} knows.`;

    return `
      <p>${scopeNote} You cannot act on the bomb — type instructions for the Operator.</p>
      ${bombKeyBanner(view)}
      ${renderGatedPanel(view, panel)}
      ${renderInstructForm(view)}
      ${renderLog(view)}
    `;
  }

  function renderGatedPanel(view, innerHtml) {
    if (view.playStyle !== 'local') return innerHtml;
    const revealed = state.revealed;
    return `
      <div class="reveal-gate ${revealed ? 'revealed' : ''}" id="reveal-gate">
        <button type="button" class="reveal-btn" id="reveal-btn" aria-pressed="${revealed}">${revealed ? 'Hide Panel (currently visible)' : 'Show Panel (currently hidden)'}</button>
        <div class="gated-content" id="gated-content" aria-hidden="${!revealed}">${innerHtml}</div>
      </div>
    `;
  }

  function renderInstructForm(view) {
    const myText = (view.instructions || {})[view.yourRole] || '';
    return `
      <form id="instruct-form">
        <label for="instruct-input">Instruction for the Operator</label>
        <input id="instruct-input" type="text" maxlength="140" autocomplete="off" value="${escapeAttr(myText)}" ${view.status !== 'active' ? 'disabled' : ''}>
        <button type="submit" ${view.status !== 'active' ? 'disabled' : ''}>Send instruction</button>
      </form>
    `;
  }

  function renderLog(view) {
    const entries = view.log || [];
    if (!entries.length) return '';
    return `<h3>Activity</h3><div class="log">${entries.map((e) => `<div>${escapeHtml(e.from)}: ${escapeHtml(e.value)}</div>`).join('')}</div>`;
  }

  function escapeAttr(s) {
    return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  // ---- Render + event wiring -------------------------------------------

  // The server broadcasts every second for the timer tick alone, even when
  // nothing else changed. Rebuilding the whole DOM on every one of those —
  // including a fresh .focus() call on a brand-new node — snapped the page
  // back to whatever input was focused and disrupted typing/IME every
  // second. Only rebuild when something other than the clock actually
  // changed; otherwise just patch the timer/spread text in place.
  function viewSignature(view) {
    const { timeRemaining, serverTime, ...rest } = view;
    return JSON.stringify(rest) + '|' + state.revealed;
  }

  function patchTimerOnly(view) {
    const timerEl = root.querySelector('.timer');
    if (timerEl) {
      const low = view.timeRemaining <= 20;
      const m = Math.floor(view.timeRemaining / 60);
      const s = String(view.timeRemaining % 60).padStart(2, '0');
      timerEl.textContent = `${m}:${s}`;
      timerEl.classList.toggle('low', low);
      timerEl.setAttribute('aria-label', `Time remaining ${view.timeRemaining} seconds`);
    }
  }

  function render() {
    const view = state.view;
    if (!view) return;

    const sig = viewSignature(view);
    if (sig === state.lastSignature && state.domBuilt) {
      patchTimerOnly(view);
      return;
    }
    state.lastSignature = sig;
    state.domBuilt = true;

    // Full rebuild path below — preserve focus/value/selection across it
    // for the rare case a structural change (module solved, new log entry,
    // role taken) lands in the same tick as an in-progress keystroke.
    const active = document.activeElement;
    const activeId = active && root.contains(active) ? active.id : null;
    const activeValue = activeId ? active.value : null;
    const selStart = activeId && typeof active.selectionStart === 'number' ? active.selectionStart : null;
    const selEnd = activeId && typeof active.selectionEnd === 'number' ? active.selectionEnd : null;

    if (!view.yourRole || view.status === 'lobby') {
      root.innerHTML = renderRolePicker(view) + `<p id="conn-flag" class="conn-flag" hidden>Reconnecting...</p>`;
      wireRolePicker(view);
    } else {
      root.innerHTML = renderGameScreen(view) + `<p id="conn-flag" class="conn-flag" hidden>Reconnecting...</p>`;
      wireGameScreen(view);
    }

    if (activeId) {
      const el = document.getElementById(activeId);
      if (el && 'value' in el) {
        el.value = activeValue;
        el.focus();
        if (selStart !== null) {
          try { el.setSelectionRange(selStart, selEnd); } catch (e) { /* not a text-selectable input type */ }
        }
      }
    }
  }

  function wireRolePicker(view) {
    root.querySelectorAll('.role-btn').forEach((btn) => {
      btn.addEventListener('click', async () => {
        try {
          await api('/api/room/role', { roomId: state.roomId, playerId: state.playerId, role: btn.dataset.role });
        } catch (e) { alert(e.message); }
      });
    });
    const startBtn = document.getElementById('start-btn');
    if (startBtn) {
      startBtn.addEventListener('click', async () => {
        try {
          await api('/api/room/start', { roomId: state.roomId, playerId: state.playerId });
        } catch (e) { alert(e.message); }
      });
    }
  }

  function wireGameScreen(view) {
    const revealBtn = document.getElementById('reveal-btn');
    if (revealBtn) {
      revealBtn.addEventListener('click', () => {
        state.revealed = !state.revealed;
        render();
      });
    }
    root.querySelectorAll('.wire-btn[data-wire]').forEach((btn) => {
      btn.addEventListener('click', async () => {
        try {
          await api('/api/room/cut', { roomId: state.roomId, playerId: state.playerId, wireId: btn.dataset.wire, face: btn.dataset.face });
        } catch (e) { /* transient errors surface via next state push */ }
      });
    });
    root.querySelectorAll('.wire-btn[data-node]').forEach((btn) => {
      btn.addEventListener('click', async () => {
        try {
          await api('/api/room/press', { roomId: state.roomId, playerId: state.playerId, nodeId: btn.dataset.node, face: btn.dataset.face });
        } catch (e) { /* transient errors surface via next state push */ }
      });
    });
    root.querySelectorAll('.dial-input').forEach((dialInput) => {
      const face = dialInput.dataset.face;
      const dialOutput = document.getElementById('dial-output-' + face);
      dialInput.addEventListener('input', () => {
        if (dialOutput) dialOutput.textContent = dialInput.value;
      });
      dialInput.addEventListener('change', async () => {
        await api('/api/room/tune', { roomId: state.roomId, playerId: state.playerId, value: Number(dialInput.value), lock: false, face });
      });
    });
    root.querySelectorAll('.lock-btn').forEach((lockBtn) => {
      lockBtn.addEventListener('click', async () => {
        const face = lockBtn.dataset.face;
        const dialInput = document.getElementById('dial-input-' + face);
        const value = dialInput ? Number(dialInput.value) : 0;
        try {
          await api('/api/room/tune', { roomId: state.roomId, playerId: state.playerId, value, lock: true, face });
        } catch (e) { /* transient errors surface via next state push */ }
      });
    });
    root.querySelectorAll('.signal-btn').forEach((btn) => {
      btn.addEventListener('click', async () => {
        try {
          await api('/api/room/signal', { roomId: state.roomId, playerId: state.playerId, color: btn.dataset.signal, face: btn.dataset.face });
        } catch (e) { /* transient errors surface via next state push */ }
      });
    });
    root.querySelectorAll('.reel-btn').forEach((btn) => {
      btn.addEventListener('click', async () => {
        try {
          await api('/api/room/spin', { roomId: state.roomId, playerId: state.playerId, reelIndex: Number(btn.dataset.reel), delta: Number(btn.dataset.delta), face: btn.dataset.face });
        } catch (e) { /* transient errors surface via next state push */ }
      });
    });
    root.querySelectorAll('.submit-password-btn').forEach((btn) => {
      btn.addEventListener('click', async () => {
        try {
          await api('/api/room/submit-password', { roomId: state.roomId, playerId: state.playerId, face: btn.dataset.face });
        } catch (e) { /* transient errors surface via next state push */ }
      });
    });
    root.querySelectorAll('.maze-btn').forEach((btn) => {
      btn.addEventListener('click', async () => {
        try {
          await api('/api/room/move', { roomId: state.roomId, playerId: state.playerId, dir: btn.dataset.dir, face: btn.dataset.face });
        } catch (e) { /* transient errors surface via next state push */ }
      });
    });
    root.querySelectorAll('.morse-btn').forEach((btn) => {
      btn.addEventListener('click', async () => {
        try {
          await api('/api/room/morse', { roomId: state.roomId, playerId: state.playerId, letter: btn.dataset.letter, face: btn.dataset.face });
        } catch (e) { /* transient errors surface via next state push */ }
      });
    });
    const form = document.getElementById('instruct-form');
    if (form) {
      form.addEventListener('submit', async (evt) => {
        evt.preventDefault();
        const input = document.getElementById('instruct-input');
        await api('/api/room/instruct', { roomId: state.roomId, playerId: state.playerId, text: input.value });
      });
    }
    const resetBtn = document.getElementById('reset-btn');
    if (resetBtn) {
      resetBtn.addEventListener('click', async () => {
        state.revealed = false;
        await api('/api/room/reset', { roomId: state.roomId, playerId: state.playerId });
      });
    }
    const bomb3dMount = document.getElementById('bomb3d-mount');
    if (bomb3dMount && window.RelayBomb3D) {
      window.RelayBomb3D.sync(bomb3dMount, view, {
        onSignal: async (face, color) => {
          try {
            await api('/api/room/signal', { roomId: state.roomId, playerId: state.playerId, color, face });
          } catch (e) { /* transient errors surface via next state push */ }
        },
        onSpin: async (face, reelIndex, delta) => {
          try {
            await api('/api/room/spin', { roomId: state.roomId, playerId: state.playerId, reelIndex, delta, face });
          } catch (e) { /* transient errors surface via next state push */ }
        },
        onCut: async (face, wireId) => {
          try {
            await api('/api/room/cut', { roomId: state.roomId, playerId: state.playerId, wireId, face });
          } catch (e) { /* transient errors surface via next state push */ }
        },
        onPress: async (face, nodeId) => {
          try {
            await api('/api/room/press', { roomId: state.roomId, playerId: state.playerId, nodeId, face });
          } catch (e) { /* transient errors surface via next state push */ }
        },
        onTune: async (face, value, lock) => {
          try {
            await api('/api/room/tune', { roomId: state.roomId, playerId: state.playerId, value, lock, face });
          } catch (e) { /* transient errors surface via next state push */ }
          if (!lock) {
            const dialInput = document.getElementById('dial-input-' + face);
            const dialOutput = document.getElementById('dial-output-' + face);
            if (dialInput) dialInput.value = value;
            if (dialOutput) dialOutput.textContent = value;
          }
        },
      });
    }
  }

  // ---- Boot -------------------------------------------------------------

  const saved = loadSession();
  if (saved) {
    state.roomId = saved.roomId;
    state.playerId = saved.playerId;
    connectStream();
  } else {
    renderLobbyForm();
  }
})();
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// Persistent 3D bomb view for the Blind Operator. The surrounding page does
// a full innerHTML rebuild on every SSE tick (see render() above), which
// would normally destroy/recreate the canvas and its WebGL context every
// second — so scene setup happens once, and sync() just reparents the same
// live canvas node into whatever fresh #bomb3d-mount container render()
// produced, then updates wire/crack state to match the latest server view.
let ctx = null; // { renderer, scene, camera, controls, casing, moduleGroup, crackFaces, drawCracks, wireIndex, onCut, lastSignature, resizeTick }

function lerpColor(hexA, hexB, t) {
  const ar = (hexA >> 16) & 255, ag = (hexA >> 8) & 255, ab = hexA & 255;
  const br = (hexB >> 16) & 255, bg = (hexB >> 8) & 255, bb = hexB & 255;
  const r = Math.round(ar + (br - ar) * t);
  const g = Math.round(ag + (bg - ag) * t);
  const b = Math.round(ab + (bb - ab) * t);
  return `rgb(${r},${g},${b})`;
}

function makeCrackFace(casing, position, rotation) {
  const canvas = document.createElement('canvas');
  canvas.width = 512;
  canvas.height = 512;
  const c2d = canvas.getContext('2d');
  const texture = new THREE.CanvasTexture(canvas);
  const mat = new THREE.MeshBasicMaterial({ map: texture, transparent: true, opacity: 0, depthWrite: false });
  const plane = new THREE.Mesh(new THREE.PlaneGeometry(1.62, 1.62), mat);
  plane.position.copy(position);
  plane.rotation.copy(rotation);
  casing.add(plane);

  let rng = Math.random() * 1e6;
  const rand = () => { rng = (rng * 9301 + 49297) % 233280; return rng / 233280; };
  const paths = [];
  let mainPath = null;
  const MAX_GEN = 5;

  function growPath(path, segments, reach) {
    let { x, y } = path.points[path.points.length - 1];
    let angle = path.angle;
    for (let s = 0; s < segments; s++) {
      angle += (rand() - 0.5) * 1.1;
      x += Math.cos(angle) * reach * (0.7 + rand() * 0.6);
      y += Math.sin(angle) * reach * (0.7 + rand() * 0.6);
      path.points.push({ x, y });
    }
    path.angle = angle;
  }

  function spawnBranch() {
    const branchPaths = paths.filter((p) => p.gen >= 1 && p.gen < MAX_GEN);
    const pool = branchPaths.length && rand() < 0.7 ? branchPaths : paths.filter((p) => p.gen < MAX_GEN);
    const source = pool.length ? pool[Math.floor(rand() * pool.length)] : mainPath;
    const root = source.points[Math.floor(rand() * source.points.length)];
    const branch = { points: [{ x: root.x, y: root.y }], angle: rand() * Math.PI * 2, gen: source.gen + 1 };
    paths.push(branch);
    return branch;
  }

  function draw(fraction) {
    const w = canvas.width, h = canvas.height;
    c2d.clearRect(0, 0, w, h);
    if (fraction <= 0) { texture.needsUpdate = true; return; }
    if (!mainPath) {
      mainPath = { points: [{ x: w / 2, y: h / 2 }], angle: rand() * Math.PI * 2, gen: 0 };
      paths.push(mainPath);
    }
    const escalation = fraction * fraction * fraction;
    const reach = 14 + escalation * 34;
    const targetMainSegments = Math.round(4 + fraction * 26);
    while (mainPath.points.length - 1 < targetMainSegments) growPath(mainPath, 1, reach);
    const targetBranches = Math.round(3 + escalation * 55);
    while (paths.length - 1 < targetBranches) {
      const branch = spawnBranch();
      growPath(branch, 2 + Math.floor(rand() * 4), reach * Math.pow(0.72, branch.gen));
    }
    for (const path of paths) {
      if (path !== mainPath) growPath(path, 1, reach * Math.pow(0.72, path.gen) * 0.7);
    }
    const color = lerpColor(0x8a1f1a, 0xfff2b0, Math.min(1, fraction * 1.15));
    for (const path of paths) {
      const taper = Math.pow(0.78, path.gen);
      c2d.strokeStyle = color;
      c2d.lineWidth = Math.max(0.6, (1.6 + escalation * 6) * taper);
      c2d.shadowColor = color;
      c2d.shadowBlur = (5 + escalation * 44) * Math.max(0.4, taper);
      c2d.beginPath();
      c2d.moveTo(path.points[0].x, path.points[0].y);
      for (let i = 1; i < path.points.length; i++) c2d.lineTo(path.points[i].x, path.points[i].y);
      c2d.stroke();
    }
    texture.needsUpdate = true;
  }

  return { draw, mat };
}

function buildShapeGlyph(shapeName) {
  const size = 0.085;
  let geo;
  if (shapeName === 'circle') {
    geo = new THREE.CircleGeometry(size, 24);
  } else if (shapeName === 'square') {
    geo = new THREE.PlaneGeometry(size * 1.6, size * 1.6);
  } else if (shapeName === 'triangle') {
    const s = new THREE.Shape();
    s.moveTo(0, size * 1.1); s.lineTo(size, -size * 0.7); s.lineTo(-size, -size * 0.7); s.closePath();
    geo = new THREE.ShapeGeometry(s);
  } else if (shapeName === 'diamond') {
    const s = new THREE.Shape();
    s.moveTo(0, size * 1.15); s.lineTo(size * 1.15, 0); s.lineTo(0, -size * 1.15); s.lineTo(-size * 1.15, 0); s.closePath();
    geo = new THREE.ShapeGeometry(s);
  } else {
    const s = new THREE.Shape();
    const spikes = 5, outerR = size * 1.25, innerR = size * 0.55;
    for (let i = 0; i < spikes * 2; i++) {
      const r = i % 2 === 0 ? outerR : innerR;
      const a = (Math.PI / spikes) * i - Math.PI / 2;
      const x = Math.cos(a) * r, y = Math.sin(a) * r;
      if (i === 0) s.moveTo(x, y); else s.lineTo(x, y);
    }
    s.closePath();
    geo = new THREE.ShapeGeometry(s);
  }
  const mat = new THREE.MeshStandardMaterial({ color: 0xdfe4ea, roughness: 0.5, metalness: 0.1, side: THREE.DoubleSide });
  return new THREE.Mesh(geo, mat);
}

const WIRE_RADIUS = 0.045;
const WIRE_LENGTH = 0.88;

// Matches the flat 2D panel's CSS color names — the Operator sees the real
// bomb now (real KTANE: the defuser sees everything), so insulation is
// colored, not neutral gray.
const COLOR_HEX = { red: 0xff5a5f, blue: 0x4ea8ff, yellow: 0xffd23f, green: 0x4cd787, purple: 0xb980ff };

function buildWireGroup(shape, color) {
  const group = new THREE.Group();
  group.rotation.z = (Math.random() - 0.5) * 0.05;

  const coreMat = new THREE.MeshStandardMaterial({ color: COLOR_HEX[color] || 0x7d8590, roughness: 0.6, metalness: 0.1 });
  const core = new THREE.Mesh(new THREE.CylinderGeometry(WIRE_RADIUS, WIRE_RADIUS, WIRE_LENGTH, 16), coreMat);
  group.add(core);

  const capMat = new THREE.MeshStandardMaterial({ color: 0xd7dde3, roughness: 0.25, metalness: 0.9 });
  const capGeo = new THREE.CylinderGeometry(WIRE_RADIUS * 1.2, WIRE_RADIUS * 1.2, 0.05, 16);
  const capTop = new THREE.Mesh(capGeo, capMat);
  capTop.position.y = WIRE_LENGTH / 2 + 0.02;
  group.add(capTop);
  const capBottom = new THREE.Mesh(capGeo, capMat);
  capBottom.position.y = -(WIRE_LENGTH / 2 + 0.02);
  group.add(capBottom);

  const glyph = buildShapeGlyph(shape);
  glyph.position.set(0, 0, WIRE_RADIUS + 0.015);
  group.add(glyph);

  return { group, core, glyph };
}

function severWire(entry) {
  const { group, core, glyph } = entry;
  core.visible = false;
  // The shape glyph sits at the wire's midpoint — exactly where the cut gap
  // opens up. Left visible, it visually plugs the gap and the wire reads as
  // still intact, so hide it once severed.
  if (glyph) glyph.visible = false;
  const gap = 0.16;
  const stubLen = (WIRE_LENGTH - gap) / 2;
  const stubMat = core.material.clone();
  stubMat.color.multiplyScalar(0.55);

  const topStub = new THREE.Mesh(new THREE.CylinderGeometry(WIRE_RADIUS, WIRE_RADIUS, stubLen, 16), stubMat);
  topStub.position.y = WIRE_LENGTH / 2 - stubLen / 2;
  group.add(topStub);
  const bottomStub = new THREE.Mesh(new THREE.CylinderGeometry(WIRE_RADIUS, WIRE_RADIUS, stubLen, 16), stubMat);
  bottomStub.position.y = -(WIRE_LENGTH / 2 - stubLen / 2);
  group.add(bottomStub);

  const cutCapGeo = new THREE.CylinderGeometry(WIRE_RADIUS * 1.05, WIRE_RADIUS * 1.05, 0.02, 16);
  const cutCapMat = new THREE.MeshStandardMaterial({ color: 0xcfd8e3, roughness: 0.25, metalness: 0.9 });
  const cutCapTop = new THREE.Mesh(cutCapGeo, cutCapMat);
  cutCapTop.position.y = topStub.position.y - stubLen / 2 - 0.01;
  group.add(cutCapTop);
  const cutCapBottom = new THREE.Mesh(cutCapGeo, cutCapMat);
  cutCapBottom.position.y = bottomStub.position.y + stubLen / 2 + 0.01;
  group.add(cutCapBottom);
}

// --- Handshake grid: a wall of pressable node-buttons -----------------
function buildNodeButton(shape, color) {
  const group = new THREE.Group();
  const baseMat = new THREE.MeshStandardMaterial({ color: COLOR_HEX[color] || 0x2a313c, roughness: 0.6, metalness: 0.15 });
  const baseGeo = new THREE.CylinderGeometry(0.12, 0.12, 0.06, 20);
  baseGeo.rotateX(Math.PI / 2); // rotate geometry, not mesh, so the glyph child's +z lands toward the camera
  const base = new THREE.Mesh(baseGeo, baseMat);
  group.add(base);
  const glyph = buildShapeGlyph(shape);
  glyph.position.set(0, 0, 0.035);
  group.add(glyph);
  return { group, base, glyph };
}

function pressNode(entry) {
  entry.base.material.color.set(0x3fb950);
  entry.base.material.emissive = new THREE.Color(0x1c5c2e);
  entry.group.position.z -= 0.025;
}

// --- Frequency lock: a rotary dial with a needle and a static channel key --
function buildDigitPlate(text) {
  const canvas = document.createElement('canvas');
  canvas.width = 128;
  canvas.height = 128;
  const c2d = canvas.getContext('2d');
  c2d.fillStyle = '#11151b';
  c2d.fillRect(0, 0, 128, 128);
  c2d.fillStyle = '#dfe4ea';
  c2d.font = 'bold 72px monospace';
  c2d.textAlign = 'center';
  c2d.textBaseline = 'middle';
  c2d.fillText(String(text), 64, 68);
  const tex = new THREE.CanvasTexture(canvas);
  const mat = new THREE.MeshBasicMaterial({ map: tex });
  return new THREE.Mesh(new THREE.PlaneGeometry(0.32, 0.32), mat);
}

const DIAL_SWEEP = 2.05; // radians either side of center — ~235 degree gauge sweep

function valueToAngle(value) {
  return ((Math.max(0, Math.min(100, value)) / 100) * 2 - 1) * DIAL_SWEEP;
}

function angleToValue(angle) {
  const clamped = Math.max(-DIAL_SWEEP, Math.min(DIAL_SWEEP, angle));
  return Math.round(((clamped / DIAL_SWEEP) + 1) / 2 * 100);
}

// Same fixed calibration as the 2D dial's tick marks — printed on the
// instrument itself, not part of any single round's secret target.
const FREQ_ZONES_3D = { A: 15, B: 40, C: 60, D: 85 };

function buildDialScene(freq) {
  const discMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.6, metalness: 0.15 });
  // Rotate the geometry itself (not the mesh) so the mesh transform stays
  // identity — children placed at local +z then correctly land toward the
  // camera (world +Z) instead of being thrown off along world -Y.
  const discGeo = new THREE.CylinderGeometry(0.5, 0.5, 0.06, 40);
  discGeo.rotateX(Math.PI / 2);
  const disc = new THREE.Mesh(discGeo, discMat);

  const rimMat = new THREE.MeshStandardMaterial({ color: 0xf0d9b5, roughness: 0.5, metalness: 0.2 });
  const rim = new THREE.Mesh(new THREE.TorusGeometry(0.5, 0.02, 10, 40), rimMat);
  disc.add(rim);

  const needlePivot = new THREE.Group();
  const needleMat = new THREE.MeshStandardMaterial({ color: 0xf85149, roughness: 0.4, metalness: 0.2, emissive: 0x3a0f0d });
  const needle = new THREE.Mesh(new THREE.BoxGeometry(0.045, 0.42, 0.03), needleMat);
  needle.position.y = 0.21;
  needlePivot.add(needle);
  const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.05, 16), new THREE.MeshStandardMaterial({ color: 0xd7dde3, roughness: 0.3, metalness: 0.8 }));
  hub.rotation.x = Math.PI / 2;
  needlePivot.add(hub);
  disc.add(needlePivot);
  needlePivot.position.z = 0.04;

  const label = buildDigitPlate(freq.channelLabel);
  label.position.set(0, -0.72, 0);

  for (const [zone, pos] of Object.entries(FREQ_ZONES_3D)) {
    const angle = valueToAngle(pos);
    const plate = buildDigitPlate(zone);
    plate.scale.set(0.4, 0.4, 0.4);
    const r = 0.62;
    plate.position.set(Math.sin(angle) * r, Math.cos(angle) * r, 0.03);
    disc.add(plate);
  }

  return { disc, needlePivot, label };
}

function createContext() {
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xfff6e9);

  const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
  camera.position.set(2.2, 1.6, 2.2);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.minDistance = 1.6;
  controls.maxDistance = 5;

  scene.add(new THREE.AmbientLight(0xfff2d9, 0.75));
  const key = new THREE.DirectionalLight(0xffffff, 1.1);
  key.position.set(3, 4, 2);
  scene.add(key);
  const rim = new THREE.DirectionalLight(0xb980ff, 0.35);
  rim.position.set(-3, -1, -2);
  scene.add(rim);

  const casingGeo = new THREE.BoxGeometry(1.6, 1.6, 1.6);
  const casing = new THREE.Mesh(casingGeo, new THREE.MeshStandardMaterial({ color: 0xfff0d6, roughness: 0.55, metalness: 0.1 }));
  casing.rotation.y = 0.4;
  scene.add(casing);
  casing.add(new THREE.LineSegments(new THREE.EdgesGeometry(casingGeo), new THREE.LineBasicMaterial({ color: 0xf0d9b5 })));

  // Every face gets its own module mount (group + backing plate), matching
  // the same 6 face slots the crack overlay already uses. Two of these get
  // populated per round (see sync()); the rest stay empty. Orbit target
  // stays at the casing's own origin — with modules on arbitrary faces,
  // there's no single "the" module to recenter on anymore.
  const HALF = 0.805;
  const FACE_CONFIG = {
    front: { pos: new THREE.Vector3(0, 0, HALF), rot: new THREE.Euler(0, 0, 0) },
    back: { pos: new THREE.Vector3(0, 0, -HALF), rot: new THREE.Euler(0, Math.PI, 0) },
    right: { pos: new THREE.Vector3(HALF, 0, 0), rot: new THREE.Euler(0, Math.PI / 2, 0) },
    left: { pos: new THREE.Vector3(-HALF, 0, 0), rot: new THREE.Euler(0, -Math.PI / 2, 0) },
    top: { pos: new THREE.Vector3(0, HALF, 0), rot: new THREE.Euler(-Math.PI / 2, 0, 0) },
    bottom: { pos: new THREE.Vector3(0, -HALF, 0), rot: new THREE.Euler(Math.PI / 2, 0, 0) },
  };
  const moduleMounts = {};
  for (const [face, cfg] of Object.entries(FACE_CONFIG)) {
    const group = new THREE.Group();
    group.position.copy(cfg.pos);
    group.rotation.copy(cfg.rot);
    casing.add(group);
    const plate = new THREE.Mesh(new THREE.PlaneGeometry(1.3, 1.3), new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.7 }));
    group.add(plate);
    moduleMounts[face] = { group, plate, moduleType: null, wireIndex: {}, nodeIndex: {}, dial: null, signalIndex: {}, reelIndex: {}, signature: '' };
  }

  const crackFaces = Object.entries(FACE_CONFIG).map(([, cfg]) => makeCrackFace(casing, cfg.pos, cfg.rot));
  function drawCracks(fraction) {
    for (const face of crackFaces) face.draw(fraction);
    const opacity = Math.min(1, fraction * 0.95 + (fraction > 0 ? 0.15 : 0));
    for (const face of crackFaces) face.mat.opacity = opacity;
  }

  const raycaster = new THREE.Raycaster();
  const pointer = new THREE.Vector2();
  renderer.domElement.addEventListener('pointerdown', (ev) => {
    if (!c.actions) return;
    const rect = renderer.domElement.getBoundingClientRect();
    pointer.x = ((ev.clientX - rect.left) / rect.width) * 2 - 1;
    pointer.y = -((ev.clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(pointer, camera);

    for (const [face, mount] of Object.entries(c.moduleMounts)) {
      if (mount.moduleType === 'wire_cut' && c.actions.onCut) {
        const targets = Object.values(mount.wireIndex).map((e) => e.core);
        const hits = raycaster.intersectObjects(targets, false);
        if (!hits.length) continue;
        const found = Object.entries(mount.wireIndex).find(([, e]) => e.core === hits[0].object);
        if (!found || found[1].cut) continue;
        c.actions.onCut(face, found[0]);
        return;
      } else if (mount.moduleType === 'handshake_grid' && c.actions.onPress) {
        const targets = Object.values(mount.nodeIndex).map((e) => e.base);
        const hits = raycaster.intersectObjects(targets, false);
        if (!hits.length) continue;
        const found = Object.entries(mount.nodeIndex).find(([, e]) => e.base === hits[0].object);
        if (!found || found[1].pressed) continue;
        c.actions.onPress(face, found[0]);
        return;
      } else if (mount.moduleType === 'frequency_lock' && c.actions.onTune && mount.dial) {
        const hits = raycaster.intersectObject(mount.dial.disc, false);
        if (!hits.length) continue;
        const local = mount.dial.disc.worldToLocal(hits[0].point.clone());
        const angle = Math.atan2(local.x, local.y);
        c.actions.onTune(face, angleToValue(angle), false);
        return;
      } else if (mount.moduleType === 'signal_decode' && c.actions.onSignal) {
        const targets = Object.values(mount.signalIndex).map((e) => e.base);
        const hits = raycaster.intersectObjects(targets, false);
        if (!hits.length) continue;
        const found = Object.entries(mount.signalIndex).find(([, e]) => e.base === hits[0].object);
        if (!found) continue;
        c.actions.onSignal(face, found[0]);
        return;
      } else if (mount.moduleType === 'password_lock' && c.actions.onSpin) {
        const targets = Object.values(mount.reelIndex).map((e) => e.plate);
        const hits = raycaster.intersectObjects(targets, false);
        if (!hits.length) continue;
        const found = Object.entries(mount.reelIndex).find(([, e]) => e.plate === hits[0].object);
        if (!found) continue;
        c.actions.onSpin(face, Number(found[0]), 1);
        return;
      }
    }
  });

  let lastW = 0, lastH = 0;
  function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  }
  animate();

  const c = {
    renderer, scene, camera, controls, casing, moduleMounts, drawCracks,
    actions: null, lastW, lastH,
  };
  return c;
}

function ensureSize(mountEl) {
  const w = mountEl.clientWidth || 300;
  const h = mountEl.clientHeight || 300;
  if (w !== ctx.lastW || h !== ctx.lastH) {
    ctx.renderer.setSize(w, h, false);
    ctx.camera.aspect = w / h;
    ctx.camera.updateProjectionMatrix();
    ctx.lastW = w;
    ctx.lastH = h;
  }
}

function clearMount(mount) {
  const toRemove = mount.group.children.filter((child) => child !== mount.plate);
  for (const child of toRemove) mount.group.remove(child);
  mount.wireIndex = {};
  mount.nodeIndex = {};
  mount.dial = null;
  mount.signalIndex = {};
  mount.reelIndex = {};
  mount.mazeTiles = null;
  mount.mazeToken = null;
  mount.mazeGoal = null;
  mount.mazeSize = null;
  mount.morsePlate = null;
  mount.morseProgressPlate = null;
  mount.moduleType = null;
  mount.signature = '';
}

function buildWireCutInMount(mount, wires) {
  const count = wires.length;
  const spacing = 1.3 / (count + 1);
  wires.forEach((w, i) => {
    const x = -1.3 / 2 + spacing * (i + 1);
    const { group, core, glyph } = buildWireGroup(w.shape, w.color);
    group.position.set(x, 0, 0.03);
    mount.group.add(group);
    const entry = { group, core, glyph, cut: false };
    mount.wireIndex[w.id] = entry;
    if (w.cut) {
      severWire(entry);
      entry.cut = true;
    }
  });
}

function buildHandshakeInMount(mount, grid) {
  const spacing = 1.2 / (grid.size + 1);
  grid.nodes.forEach((n) => {
    const x = -1.2 / 2 + spacing * (n.col + 1);
    const y = 1.2 / 2 - spacing * (n.row + 1);
    const { group, base, glyph } = buildNodeButton(n.shape, n.color);
    group.position.set(x, y, 0.03);
    mount.group.add(group);
    const entry = { group, base, glyph, pressed: false };
    mount.nodeIndex[n.id] = entry;
    if (n.pressed) {
      pressNode(entry);
      entry.pressed = true;
    }
  });
}

function buildFrequencyInMount(mount, freq) {
  const dial = buildDialScene(freq);
  dial.disc.position.set(0, 0, 0.05);
  mount.group.add(dial.disc);
  mount.group.add(dial.label);
  dial.needlePivot.rotation.z = valueToAngle(freq.dialValue);
  mount.dial = dial;
}

// --- Signal decode: a row of clickable colored buttons -----------------
function buildSignalInMount(mount, signal) {
  const colors = signal.buttonColors;
  const spacing = 1.2 / (colors.length + 1);
  colors.forEach((c, i) => {
    const x = -1.2 / 2 + spacing * (i + 1);
    const { group, base, glyph } = buildNodeButton('circle', c);
    group.position.set(x, 0, 0.03);
    mount.group.add(group);
    mount.signalIndex[c] = { group, base, glyph };
  });
}

// --- Password lock: a row of letter-plate reels, click to advance -------
function buildPasswordInMount(mount, password) {
  const reels = password.reels;
  const spacing = 1.2 / (reels.length + 1);
  reels.forEach((r, i) => {
    const x = -1.2 / 2 + spacing * (i + 1);
    const plate = buildDigitPlate(ALPHABET[r.letterIndex]);
    plate.position.set(x, 0, 0.03);
    mount.group.add(plate);
    mount.reelIndex[i] = { plate, letterIndex: r.letterIndex };
  });
}

function updatePasswordPlate(mount, i, letterIndex) {
  const entry = mount.reelIndex[i];
  if (!entry || entry.letterIndex === letterIndex) return;
  const x = entry.plate.position.x, z = entry.plate.position.z;
  mount.group.remove(entry.plate);
  const plate = buildDigitPlate(ALPHABET[letterIndex]);
  plate.position.set(x, 0, z);
  mount.group.add(plate);
  mount.reelIndex[i] = { plate, letterIndex };
}

const ALPHABET = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';

// --- Maze: an even floor grid the Operator can see, with a token at their
// current position and a marker at the goal — walls stay invisible here,
// same as the real panel; movement itself happens via the 2D arrow pad.
function buildMazeInMount(mount, maze) {
  const size = maze.size;
  const spacing = 1.2 / size;
  const tileGeo = new THREE.PlaneGeometry(spacing * 0.85, spacing * 0.85);
  const tileMat = new THREE.MeshStandardMaterial({ color: 0xeef2ff, roughness: 0.8 });
  const tiles = [];
  for (let r = 0; r < size; r++) {
    for (let c = 0; c < size; c++) {
      const tile = new THREE.Mesh(tileGeo, tileMat);
      tile.position.set(-0.6 + spacing * (c + 0.5), 0.6 - spacing * (r + 0.5), 0.01);
      mount.group.add(tile);
      tiles.push(tile);
    }
  }
  const tokenMat = new THREE.MeshStandardMaterial({ color: 0x4ea8ff, roughness: 0.4, metalness: 0.2, emissive: 0x0d3a66 });
  const token = new THREE.Mesh(new THREE.SphereGeometry(spacing * 0.28, 16, 16), tokenMat);
  token.position.z = 0.05;
  mount.group.add(token);
  const goalMat = new THREE.MeshStandardMaterial({ color: 0x35c26a, roughness: 0.4, metalness: 0.2, emissive: 0x0d5c2a });
  const goal = new THREE.Mesh(new THREE.TorusGeometry(spacing * 0.32, spacing * 0.06, 8, 20), goalMat);
  goal.position.z = 0.04;
  mount.group.add(goal);
  mount.mazeTiles = tiles;
  mount.mazeToken = token;
  mount.mazeGoal = goal;
  mount.mazeSize = size;
  positionMazeMarkers(mount, maze);
}

function positionMazeMarkers(mount, maze) {
  const size = mount.mazeSize;
  const spacing = 1.2 / size;
  mount.mazeToken.position.set(-0.6 + spacing * (maze.pos.col + 0.5), 0.6 - spacing * (maze.pos.row + 0.5), 0.05);
  mount.mazeGoal.position.set(-0.6 + spacing * (maze.goal.col + 0.5), 0.6 - spacing * (maze.goal.row + 0.5), 0.04);
}

// --- Morse relay: a single plate showing the raw flashed groups and how
// far the Operator has relayed — the 26-letter keypad lives in the 2D pad.
function buildMorseInMount(mount, morse) {
  const plate = buildDigitPlate(morse.signals.join(' '));
  plate.scale.set(1.6, 0.5, 1);
  plate.position.set(0, 0.25, 0.03);
  mount.group.add(plate);
  const progressPlate = buildDigitPlate(`${morse.progress}/${morse.signals.length}`);
  progressPlate.scale.set(0.6, 0.6, 1);
  progressPlate.position.set(0, -0.4, 0.03);
  mount.group.add(progressPlate);
  mount.morsePlate = plate;
  mount.morseProgressPlate = progressPlate;
}

function updateMorseProgress(mount, morse) {
  if (!mount.morseProgressPlate) return;
  const x = mount.morseProgressPlate.position.x, y = mount.morseProgressPlate.position.y, z = mount.morseProgressPlate.position.z;
  mount.group.remove(mount.morseProgressPlate);
  const plate = buildDigitPlate(`${morse.progress}/${morse.signals.length}`);
  plate.scale.set(0.6, 0.6, 1);
  plate.position.set(x, y, z);
  mount.group.add(plate);
  mount.morseProgressPlate = plate;
}

function moduleSignature(mod) {
  if (mod.moduleType === 'wire_cut') return 'wire_cut:' + (mod.wires || []).map((w) => w.id).join(',');
  if (mod.moduleType === 'handshake_grid' && mod.grid) return 'handshake_grid:' + mod.grid.nodes.map((n) => n.id).join(',');
  if (mod.moduleType === 'frequency_lock' && mod.freq) return 'frequency_lock:' + mod.freq.channelLabel;
  if (mod.moduleType === 'signal_decode' && mod.signal) return 'signal_decode:' + mod.signal.buttonColors.join(',') + ':' + mod.signal.signals.length;
  if (mod.moduleType === 'password_lock' && mod.password) return 'password_lock:' + mod.password.reels.length;
  if (mod.moduleType === 'maze' && mod.maze) return 'maze:' + mod.maze.size;
  if (mod.moduleType === 'morse_relay' && mod.morse) return 'morse_relay:' + mod.morse.signals.length;
  return mod.moduleType || '';
}

function sync(mountEl, view, actions) {
  if (!ctx) ctx = createContext();
  if (mountEl.firstChild !== ctx.renderer.domElement) {
    mountEl.innerHTML = '';
    mountEl.appendChild(ctx.renderer.domElement);
  }
  ctx.actions = actions;
  ensureSize(mountEl);

  const modules = view.modules || [];
  const activeFaces = new Set(modules.map((m) => m.face));
  // A face that had a module last round but doesn't this round (modules
  // reshuffle onto random faces each round) needs to go back to empty.
  for (const [face, mount] of Object.entries(ctx.moduleMounts)) {
    if (!activeFaces.has(face) && mount.moduleType) clearMount(mount);
  }

  for (const mod of modules) {
    const mount = ctx.moduleMounts[mod.face];
    if (!mount) continue;
    const sig = moduleSignature(mod);
    if (sig !== mount.signature) {
      clearMount(mount);
      mount.moduleType = mod.moduleType;
      mount.signature = sig;
      if (mod.moduleType === 'wire_cut') buildWireCutInMount(mount, mod.wires || []);
      else if (mod.moduleType === 'handshake_grid' && mod.grid) buildHandshakeInMount(mount, mod.grid);
      else if (mod.moduleType === 'frequency_lock' && mod.freq) buildFrequencyInMount(mount, mod.freq);
      else if (mod.moduleType === 'signal_decode' && mod.signal) buildSignalInMount(mount, mod.signal);
      else if (mod.moduleType === 'password_lock' && mod.password) buildPasswordInMount(mount, mod.password);
      else if (mod.moduleType === 'maze' && mod.maze) buildMazeInMount(mount, mod.maze);
      else if (mod.moduleType === 'morse_relay' && mod.morse) buildMorseInMount(mount, mod.morse);
    } else if (mod.moduleType === 'wire_cut') {
      for (const w of mod.wires || []) {
        const entry = mount.wireIndex[w.id];
        if (entry && w.cut && !entry.cut) {
          severWire(entry);
          entry.cut = true;
        }
      }
    } else if (mod.moduleType === 'handshake_grid' && mod.grid) {
      for (const n of mod.grid.nodes) {
        const entry = mount.nodeIndex[n.id];
        if (entry && n.pressed && !entry.pressed) {
          pressNode(entry);
          entry.pressed = true;
        }
      }
    } else if (mod.moduleType === 'frequency_lock' && mod.freq && mount.dial) {
      mount.dial.needlePivot.rotation.z = valueToAngle(mod.freq.dialValue);
    } else if (mod.moduleType === 'password_lock' && mod.password) {
      mod.password.reels.forEach((r, i) => updatePasswordPlate(mount, i, r.letterIndex));
    } else if (mod.moduleType === 'maze' && mod.maze && mount.mazeToken) {
      positionMazeMarkers(mount, mod.maze);
    } else if (mod.moduleType === 'morse_relay' && mod.morse) {
      updateMorseProgress(mount, mod.morse);
    }
  }

  ctx.drawCracks(Math.max(0, Math.min(1, (view.spread || 0) / 100)));
}

window.RelayBomb3D = { sync };
</script>
</body>
</html>
